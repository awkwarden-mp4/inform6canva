function library(id){const current=state.assign[id],x=PLANINFO[id];const related={text:['ai','definition','algo'],chart:['media','survey2','survey'],table:['access2','visibility','aiuse'],scheme:['phishing','before','verify']}[id];const used=new Set(Object.entries(state.assign).filter(([sid,mid])=>sid!==id&&mid).map(([,mid])=>mid));const options=related.map(getMat).filter(Boolean);if(current&&!related.includes(current)&&getMat(current))options.push(getMat(current));showModal(`<div class="modalheader between"><div><span class="eyebrow">Обери один матеріал</span><h2>${esc(x.name)}</h2><p>${esc(x.desc)}</p></div>${btn('×','close','aria-label="Закрити"')}</div><p class="library-guide">Прочитай ${options.length} короткі картки. Обери ту, яка відповідає на запитання вище.</p><div class="library focused-library">${options.map(m=>{const busy=used.has(m.id)&&current!==m.id;return `<article class="material ${current===m.id?'sel':''} ${busy?'used':''}"><h3>${esc(m.title)}</h3><p>${esc(m.body)}</p>${btn(current===m.id?'✓ Прикріплено':busy?'Уже використано':'Додати до слайда','assign',`data-id="${id}" data-material="${m.id}" ${busy?'disabled':''}`,current===m.id?'on':'')}</article>`;}).join('')}</div>`);}
function layoutIcon(id,type){let inner='';const r=(x,y,w,h,fill='#aa91df')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${fill}"/>`;const txt=(x,y,w)=>r(x,y,w,4,'#9f91bf');if(id==='chart'){if(type==='pie')inner='<circle cx="42" cy="42" r="23" fill="#8e63ce"/><path d="M42 42V19A23 23 0 0 0 21 51Z" fill="#42b8ba"/>'+txt(75,31,41)+txt(75,43,32)+txt(75,55,25);else if(type==='vertical')inner=r(26,35,18,31)+r(52,45,18,21,'#42b8ba')+r(78,54,18,12,'#85a9e0');else inner=r(20,23,90,9)+r(20,38,60,9,'#42b8ba')+r(20,53,34,9,'#85a9e0');}else if(id==='table'){inner=r(15,22,100,40,'#d9ccec')+r(15,22,100,10,'#9870d0');for(let i=1;i<(type==='rows'?4:3);i++)inner+=`<path d="M15 ${22+i*10}H115" stroke="white"/>`;for(let i=1;i<(type==='rows'?2:3);i++)inner+=`<path d="M${15+i*(type==='rows'?50:33.3)} 22V62" stroke="white"/>`;}else if(id==='scheme'){if(type==='vertical'){for(let i=0;i<3;i++)inner+=r(27,14+i*19,76,14,i%2?'#b6dedf':'#b59bdf');}else{for(let i=0;i<3;i++)inner+=r(10+i*39,31,32,32,i%2?'#b6dedf':'#b59bdf');}}else if(type==='center'){inner=txt(29,24,72)+txt(38,34,54)+r(47,44,36,25,'#b6dedf');}else if(type==='visual'){inner=id==='text'?txt(25,11,80)+r(49,21,32,19,'#b6dedf')+txt(25,44,80)+r(11,54,32,15)+r(49,54,32,15)+r(87,54,32,15):r(12,23,44,43,'#b6dedf')+txt(64,29,54)+txt(64,39,48)+txt(64,49,43);}else if(type==='cards'){inner=txt(15,12,86)+txt(15,27,43)+txt(15,36,43)+r(15,47,42,19,'#b6dedf')+r(67,24,50,12)+r(67,40,50,12)+r(67,56,50,12);}else{inner=txt(13,22,65)+txt(13,35,49)+txt(13,45,45)+txt(13,55,35)+r(79,25,39,39,'#b6dedf');}return `<svg viewBox="0 0 130 77" aria-hidden="true">${inner}</svg>`;}
function layouts(id){return `<div class="field"><div class="label">${id==='chart'?'Тип діаграми':'Структурний шаблон'}</div><p class="inlinehelp">${id==='chart'?'Дані залишаються незмінними при зміні типу.':'Обирай розташування. Текст і дані залишаться на слайді.'}</p><div class="layoutgrid">${LAYOUTS[id].map(([v,n,d])=>btn(layoutIcon(id,v)+`<span>${esc(n)}</span><small>${esc(d)}</small>`,'layout',`data-id="${id}" data-value="${v}"`,'layouttile '+(cfg(id).layout===v?'on':''))).join('')}</div></div>`;}

function content(id){let c=cfg(id);if(id==='cover')return optionSelect('Аудиторія','audience',AUDIENCES,c.audience)+optionSelect('Мета презентації','goal',GOALS,c.goal)+optionSelect('Назва','title',COVERTITLES,c.title)+optionSelect('Основна думка','idea',COVERIDEAS,c.idea)+images(id);if(id==='text')return optionSelect('Заголовок','title',TEXTTITLES,c.title)+optionSelect('Коротке пояснення','text',TEXTOPTIONS,c.text)+optionSelect('Приклади','example',EXAMPLES,c.example)+images(id);if(id==='chart')return `${optionSelect('Заголовок','title',CHARTTITLES,c.title)}<div class="field"><div class="label">Перенеси числа з опитування</div><div class="chart-inputs">${CHARTROWS.map(([n,v],i)=>`<label class="chart-input"><span>${esc(n)}</span><input type="number" min="0" max="24" step="1" inputmode="numeric" data-chart-row="${i}" value="${esc(c.values?.[i]??'')}" placeholder="—"></label>`).join('')}</div><p class="inlinehelp">Звір кожне число з даними опитування вище. Разом значення мають відповідати кількості опитаних.</p></div>${optionSelect('Висновок','conclusion',CONCLUSIONS,c.conclusion)}`;if(id==='table')return `${optionSelect('Заголовок','title',TABLETITLES,c.title)}<div class="field"><div class="label">Хто бачить інформацію?</div><div class="data-fields">${TABLEMODES.map((t,i)=>`<div class="data-row"><span>${esc(t)}</span><select aria-label="${esc(t)}" data-table-row="${i}"><option value="">Обери…</option>${TABLEANS.map(x=>`<option ${x===c.answers[i]?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>`).join('')}</div></div>${optionSelect('Коротка порада','note',TABLENOTES,c.note)}<div class="field"><div class="label">Розміщення поради</div><div class="row">${btn('Під таблицею','note-pos','data-value="bottom"',c.notePos==='bottom'?'on':'')}${btn('Над таблицею','note-pos','data-value="top"',c.notePos==='top'?'on':'')}</div></div>`;return `${optionSelect('Заголовок','title',SCHEMETITLES,c.title)}${optionSelect('Вступний текст','note',SCHEMENOTES,c.note)}<div class="field"><div class="between"><span class="label">Обери три дії</span><span class="schema-count">${c.nodes.length} / 3</span></div><p class="inlinehelp">Натисни картку, щоб додати або прибрати її. Для перестановки натисни блок на слайді та скористайся стрілками або перетягни його.</p><div class="options">${SCHEMEOPTIONS.map(n=>btn(`<span>${n.emoji}</span><span class="grow">${esc(n.text)}</span><span>${c.nodes.includes(n.id)?'✓':'＋'}</span>`,'scheme-toggle',`data-id="${n.id}" aria-pressed="${c.nodes.includes(n.id)}"`,'scheme-card '+(c.nodes.includes(n.id)?'on':''))).join('')}</div></div>`;}

if(id==='table'){add('title','title',c.title,55,30,850,79,42);if(c.notePos==='top'){add('note','text',c.note||'Обери коротку пораду',58,116,844,62,24);add('table','table','',60,192,840,280,22);}else{add('table','table','',60,126,840,291,22);add('note','text',c.note||'Обери коротку пораду',60,438,840,62,24);}}

function resetGeometry(id){const m=state.manual[id],next={};for(const [k,v] of Object.entries(m)){if(k.startsWith('extra-')){if(!v.hidden)next[k]=v;}else if(Object.hasOwn(v,'text'))next[k]={text:v.text};}state.manual[id]=next;}
function fittedSize(o){if(!['title','text'].includes(o.kind)||o.id==='examples')return o.size;const ctx=fitCanvas.getContext('2d');const limitW=Math.max(1,o.w-6),limitH=Math.max(1,o.h-4);for(let size=o.size;size>=8;size--){ctx.font=`${o.kind==='title'?800:400} ${size}px Arial`;let lines=0;for(const para of String(o.text||'').split('\n')){let row='';lines++;for(const word of para.split(/\s+/)){if(!word)continue;const next=row?row+' '+word:word;if(ctx.measureText(next).width>limitW&&row){lines++;row=word;}else row=next;if(ctx.measureText(row).width>limitW){lines+=Math.ceil(ctx.measureText(row).width/limitW)-1;row='';}}}if(lines*size*1.18<=limitH)return size;}return 8;}
const fitCanvas=document.createElement('canvas');
function objects(id){const m=state.manual[id]||{};const base=baseObjects(id).map(o=>({...o,...(m[o.id]||{})})).filter(o=>!o.hidden);const extras=Object.entries(m).filter(([k,v])=>k.startsWith('extra-')&&!v.hidden).map(([k,v])=>({id:k,...v}));return [...base,...extras].map(o=>({...o,size:fittedSize(o)}));}
function chartMarkup(c){if(!c.layout)return '<div style="border:2px dashed #a99ac9;border-radius:15px;padding:35px;text-align:center;color:#786c94;font-size:26px">Обери тип діаграми у вкладці «Макет»</div>';const colors=slideStyle('chart').dark?['#C4A7FF','#28D4C5','#FDBA74']:['#7a42d9','#00a7b5','#5f86e8'],values=chartVals(c),max=Math.ceil(Math.max(...values,12)/4)*4;if(c.layout==='horizontal')return `<div class="chart-area"><div class="bars">${CHARTROWS.map(([n],i)=>`<div class="barline"><div class="barlabel"><span>${esc(n)}</span><b>${values[i]||0}</b></div><div class="bartrack"><i style="width:${(values[i]||0)/max*100}%;background:${colors[i]}"></i></div></div>`).join('')}</div></div>`;if(c.layout==='pie'){const total=values.reduce((a,b)=>a+b,0)||1;return `<div class="chartpie"><div class="pie" style="background:${pieGradient(values,colors)}" role="img" aria-label="Кругова діаграма"></div><div class="legend">${CHARTROWS.map(([n],i)=>`<div><i style="background:${colors[i]}"></i><span>${esc(n)} — <b>${values[i]||0}</b> (${(((values[i]||0)/total)*100).toFixed(0)}%)</span></div>`).join('')}</div></div>`;}const step=Math.max(1,Math.ceil(max/4));const grid=[0,step,step*2,step*3,step*4];return `<div class="chart-area"><svg viewBox="0 0 840 300" aria-label="Стовпчаста діаграма">${grid.map(v=>{const y=240-v/max*190;return `<line x1="70" y1="${y}" x2="805" y2="${y}" stroke="#00000020"/><text x="58" y="${y+6}" text-anchor="end" font-size="18" fill="currentColor">${v}</text>`;}).join('')}${CHARTROWS.map(([n],i)=>{const x=145+i*225,h=(values[i]||0)/max*190;return `<rect x="${x}" y="${240-h}" width="125" height="${h}" rx="9" fill="${colors[i]}"/><text x="${x+62.5}" y="${228-h}" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${values[i]||0}</text><text x="${x+62.5}" y="271" text-anchor="middle" font-size="18" fill="currentColor">${esc(CHARTSHORT[i])}</text>`;}).join('')}<text x="70" y="24" font-size="17" fill="currentColor">Учнів</text></svg></div>`;}
function tableMarkup(c){if(c.layout==='columns')return `<table class="data-table"><thead><tr>${TABLEMODES.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody><tr>${c.answers.map(x=>`<td>${esc(x||'Обери відомості')}</td>`).join('')}</tr></tbody></table>`;return `<table class="data-table"><thead><tr><th>Налаштування</th><th>Хто бачить?</th></tr></thead><tbody>${TABLEMODES.map((x,i)=>`<tr><td>${esc(x)}</td><td>${esc(c.answers[i]||'—')}</td></tr>`).join('')}</tbody></table>`;}
function schemeMarkup(c,interactive){const vertical=c.layout==='vertical';return `<div class="scheme-flow ${vertical?'vertical':''}" ${interactive?'data-scheme-area':''}>${[0,1,2].map(i=>{const id=c.nodes[i],n=node(id);return `${i?`<span class="arrow" aria-hidden="true">${vertical?'↓':'→'}</span>`:''}<div class="node ${!n?'empty':''} ${interactive&&selectedNode===id&&n?'active':''}" ${interactive&&n?`data-node="${id}" draggable="true" tabindex="0" role="button" aria-label="Крок ${i+1}: ${esc(n.text)}"`:''}><span class="num-badge">${i+1}</span><div class="node-label">${n?esc(n.text):'Дія'}</div>${interactive&&n&&selectedNode===id?`<div class="node-tools">${btn(vertical?'↑':'←','node-move',`data-id="${id}" data-d="-1" ${i===0?'disabled':''} aria-label="Попереднє місце"`)}${btn(vertical?'↓':'→','node-move',`data-id="${id}" data-d="1" ${i===c.nodes.length-1?'disabled':''} aria-label="Наступне місце"`)}${btn('×','scheme-toggle',`data-id="${id}" aria-label="Прибрати крок"`)}</div>`:''}</div>`;}).join('')}</div>`;}
function objectMarkup(o,id,edit){const manual=edit&&state.manualOn[id]&&o.kind!=='source',chosen=manual&&selected===o.id;let body=o.kind==='chart'?chartMarkup(cfg(id)):o.kind==='table'?tableMarkup(cfg(id)):o.kind==='scheme'?schemeMarkup(cfg(id),edit&&!manual):o.id==='examples'&&id==='text'?exampleChips(o.text,cfg(id).layout):esc(o.text);if(['chart','table','scheme'].includes(o.kind)){const b=baseObjects(id).find(x=>x.id===o.id)||o;body=`<div class="complex-inner" data-bw="${b.w}" data-bh="${b.h}" style="width:${b.w}px;height:${b.h}px;transform:translate(-50%,-50%) scale(${Math.min(o.w/b.w,o.h/b.h)})">${body}</div>`;}let tools=chosen?`<div class="floattools">${['text','title'].includes(o.kind)?btn('✎','manual-edit',`data-obj="${o.id}" title="Редагувати текст" aria-label="Редагувати текст"`):''}${!['chart','table','scheme'].includes(o.kind)?btn('⧉','duplicate',`data-obj="${o.id}" title="Дублювати" aria-label="Дублювати"`):''}${btn('⌫','delete-obj',`data-obj="${o.id}" title="Видалити" aria-label="Видалити"`)}</div>${['nw','ne','sw','se','w','e'].map(h=>`<span class="handle ${h}" data-handle="${h}"></span>`).join('')}<span class="handle rot" data-handle="rot">⟳</span>`:'';return `<div class="slide-object ${o.kind} ${manual?'manual':''} ${chosen?'sel':''} ${o.y<45?'below-tools':''}" data-object="${esc(o.id)}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;font-size:${o.size}px;text-align:${o.align||'left'};transform:rotate(${o.rot||0}deg)"><div class="body">${body}</div>${tools}</div>`;}
function contrastInk(hex){const rgb=hex.slice(1).match(/.{2}/g).map(x=>{const v=parseInt(x,16)/255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4;});const L=.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];return L>.179?'#111827':'#FFFFFF';}
function slideHTML(id,edit=false){const p=slideStyle(id);return `<div class="slide" data-slide="${id}" data-theme="${p.dark?'dark':'light'}" style="--sbg:${p.bg};--sfg:${p.fg};--sa:${p.ac};--sheader:${contrastInk(p.ac)}">${objects(id).map(o=>objectMarkup(o,id,edit)).join('')}</div>`;}

function review(){const id=IDS[state.preview],allViewed=state.viewed.length===IDS.length;return `<div class="review-layout stack">${header('Етап 4 із 4 · Завершення','Твоя готова презентація','Переглянь слайди ліворуч. Якщо потрібно, відредагуй будь-який із них. Потім натисни одну кнопку, щоб завантажити PDF і надіслати звіт.') }${key('review')}<div class="review-workspace"><div class="review-viewer">${previewCard(id,false)}<section class="card review-controls"><div class="between"><b>Слайд ${state.preview+1} із ${IDS.length}</b><span class="smalltext">${state.viewed.length} із ${IDS.length} переглянуто</span></div><div class="review-nav">${btn('←','preview',`aria-label="Попередній слайд" data-d="-1" ${state.preview===0?'disabled':''}`)}<div class="reviewdots">${IDS.map((x,i)=>btn((state.viewed.includes(x)?'✓ ':'')+(i+1),'preview-index',`aria-label="Слайд ${i+1}: ${esc(META[x].name)}" data-index="${i}" ${state.preview===i?'aria-current="true"':''}`,state.preview===i?'on':'')).join('')}</div>${btn('→','preview',`aria-label="Наступний слайд" data-d="1" ${state.preview===IDS.length-1?'disabled':''}`)}</div>${btn('✎ Редагувати цей слайд','review-edit',`data-id="${id}"`,'review-edit-btn')}</section></div><section class="card sendcard stack"><div><span class="eyebrow">Завершення роботи</span><h2>Завантаження та надсилання</h2></div><p class="smalltext">${allViewed?'Презентація готова. Введи своє ім’я та прізвище, щоб підписати файл.':'Переглянь усі п’ять слайдів, щоб відкрити завантаження та надсилання.'}</p><form id="sendForm" class="stack" novalidate><div class="field"><label for="studentName">Ім’я та прізвище</label><input id="studentName" name="_name" autocomplete="off" maxlength="100" value="${esc(state.name)}" placeholder="Ім’я та прізвище" required ${state.sent||submitting||exporting?'readonly':''}></div><div class="field review-filename"><span class="label">Назва PDF-файлу</span><div class="pdf-filename" id="pdfFilename">${esc(pdfFilename())}</div></div>${state.sent?`<div class="good">✅ Звіт надіслано вчителю. Презентацію можна завантажити повторно.</div>${btn(exporting?'Створення PDF…':'⬇ Завантажити PDF повторно','export',`id="pdfButton" ${exporting||submitting||!allViewed?'disabled':''}`,'primary')}`:`<button type="submit" id="pdfButton" class="primary" ${submitting||exporting||!allViewed?'disabled':''}>${submitting?'Завершення роботи…':'🏁 Завантажити PDF і надіслати результат'}</button>`}<div id="pdfStatus" class="smalltext" role="status" aria-live="polite"></div><div id="sendError" class="notice" hidden role="alert"></div><p class="delivery-note">${ATTACH_PDF_TO_FORMSPREE?'PDF завантажиться на твій пристрій, а PDF і звіт надійдуть учителю.':'Одне натискання: PDF завантажиться на твій пристрій, а звіт надійде вчителю. Прикріпи PDF до завдання в Google Classroom.'}</p></form></section></div></div>`;}

let lastKnowledgeView="";
function render(){const n=state.stage,count=state.done.filter(Boolean).length;$('progressText').textContent=count+' / 4';$('progressBar').style.width=count*25+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',count);$('saveText').textContent=storageOK?'Збережено':'Не збережено';$('nav').hidden=n<0;$('nav').innerHTML=STAGES.map((t,i)=>btn(`<span class="number">${i+1}</span><span>${esc(t)}</span><span class="status">${state.done[i]?'✓':i>state.unlocked?'🔒':''}</span>`,'go',`data-n="${i}" ${i>state.unlocked?'disabled':''} ${n===i?'aria-current="step"':''}`,(n===i?'on ':'')+(state.done[i]?'done':''))).join('');try{$('main').innerHTML=(!storageOK?'<div class="notice">Локальне збереження недоступне. Не оновлюй сторінку до завершення роботи.</div>':'')+([cover,plan,visual,review][n]||intro)();}catch(err){console.error('Помилка відображення етапу',err);$('main').innerHTML=`<section class="card stack"><h2>Не вдалося відкрити цей етап</h2><p>Твої дані не видалено. Спробуй відкрити етап повторно або повернися до попереднього.</p><div class="row">${btn('Спробувати ще раз','go',`data-n="${n}"`,'primary')}${n>0?btn('До попереднього етапу','go',`data-n="${n-1}"`):''}</div></section>`;$('footer').hidden=true;return;}const knowledgeView=n===1?'plan-'+state.planStep:n===2?'slide-'+state.current:'stage-'+n;if(knowledgeView!==lastKnowledgeView){lastKnowledgeView=knowledgeView;document.querySelectorAll('.knowledge-card,.chart-source').forEach(el=>el.classList.add('attention'));}$('footer').hidden=true;if(n===0)footer('home',reviewReturn?'Зберегти й повернутися →':'Зберегти й далі →','cover-next','Обери мету, аудиторію, назву, думку й ілюстрацію.');if(n===1)footer(state.planStep===1?'plan-back':'back-cover',state.planStep===0?'Перевірити матеріали →':'Відкрити конструктор →',state.planStep===0?'check-materials':'check-order',state.planStep===0?'Матеріали мають відповідати завданням слайдів.':'Упорядкуй чотири змістові частини.');if(n===2)footer('visual-back',reviewReturn?'Зберегти й повернутися →':'Зберегти й далі →','save-slide',`${IDS.slice(1).filter(x=>state.slides[x].saved).length} / 4 основні слайди збережено`);if(resizeObserver)resizeObserver.disconnect();resizeObserver=new ResizeObserver(fit);document.querySelectorAll('.viewport').forEach(v=>resizeObserver.observe(v));fit();}
function slideProblem(id){const c=cfg(id),o=objects(id),has=k=>o.some(x=>x.id===k&&!x.hidden&&String(x.text||'').trim());if(id==='cover'){if(!c.audience||!c.goal||!c.title||!c.idea||!c.image)return 'Обери аудиторію, мету, назву, основну думку та ілюстрацію у вкладці «Наповнення».';if(!has('title')||!has('idea')||!o.some(x=>x.kind==='image'))return 'На обкладинці мають бути назва, основна думка та ілюстрація.';}else if(id==='text'){if(!c.text||!c.example||!c.title)return 'Обери заголовок, пояснення та приклади.';if(!has('title')||!has('body')||!has('examples'))return 'На слайді мають бути заголовок, пояснення та приклади.';}else if(id==='chart'){if(!c.layout||!c.title||!c.conclusion||c.values.some(x=>x===''||x===null))return 'Обери тип діаграми, впиши три значення, додай заголовок та висновок.';if(!o.some(x=>x.kind==='chart')||!has('title')||!has('conclusion'))return 'На слайді потрібні діаграма, заголовок і висновок.';}else if(id==='table'){if(!c.title||c.answers.some(x=>!x)||!c.note)return 'Заповни всі три відомості про видимість та обери пораду.';if(!o.some(x=>x.kind==='table')||!has('title')||!has('note'))return 'На слайді потрібні таблиця, заголовок та порада.';}else if(id==='scheme'){if(c.nodes.length!==3||!c.title||!c.note)return 'Додай рівно три дії, заголовок і вступний текст.';if(!o.some(x=>x.kind==='scheme')||!has('title')||!has('note'))return 'На слайді потрібні схема, заголовок і вступ.';}return '';}
function saveSlide(){const id=state.current,p=slideProblem(id);log('Спроба збереження слайда',{slide:id,success:!p,reason:p||'Усі компоненти наявні',contentScore:gradeSnapshot(id)});save();if(p){error(p);return;}state.slides[id].saved=true;selected='';selectedNode='';save();if(reviewReturn&&IDS.slice(1).every(x=>state.slides[x].saved)){state.done[2]=true;returnToReview(id);return;}const ix=IDS.indexOf(id);const next=IDS.slice(ix+1).find(x=>!state.slides[x].saved)||IDS.slice(1).find(x=>!state.slides[x].saved);if(next){state.current=next;state.tab=next==='chart'&&!state.slides.chart.layout?'layout':'content';save();render();window.scrollTo({top:0,behavior:'instant'});}else complete(2);}
function verifyMaterials(){const bad=invalidPlan();log('Перевірка матеріалів',{assign:clone(state.assign),success:!bad.length,errors:bad});save();if(bad.length){const missing=bad.filter(id=>!state.assign[id]),wrong=bad.filter(id=>state.assign[id]);const el=$('error');if(el){el.hidden=false;el.innerHTML=`<b>Потрібно ще трохи перевірити матеріали.</b>${missing.length?`<p>Ще не обрано: ${missing.map(id=>esc(PLANINFO[id].name)).join(', ')}.</p>`:''}${wrong.map(id=>`<p><b>${esc(PLANINFO[id].name)}:</b> ${esc(PLANINFO[id].hint)}</p>`).join('')}`;for(const id of bad){const card=document.querySelector(`button[data-action="library"][data-id="${id}"]`)?.closest('.plan-card');if(card)card.classList.add('needs-review');}el.scrollIntoView({block:'nearest',behavior:'smooth'});}return;}state.planStep=1;save();render();window.scrollTo({top:0,behavior:'instant'});}
function verifyOrder(){const ok=orderOK()&&!invalidPlan().length;log('Перевірка структури',{order:clone(state.order),success:ok});save();if(!ok){error('Структура ще не готова. Перевір: чи глядач спочатку дізнається про поняття, а в кінці отримує практичну інструкцію? У середині спочатку покажи факт у числах, потім довідкове порівняння.');return;}complete(1);}
function updateField(field,value){const id=state.stage===0?'cover':state.current,c=cfg(id);if(c[field]===value)return;changed('Зміна наповнення',{slide:id,field,from:c[field],to:value},()=>{c[field]=value;const objMap={title:'title',idea:'idea',text:'body',example:'examples',conclusion:'conclusion',note:'note',audience:'aud'};const k=objMap[field];if(k&&state.manual[id][k])delete state.manual[id][k].text;},id);}
function toggleNode(id){const c=state.slides.scheme;if(!node(id))return;const i=c.nodes.indexOf(id);if(i<0&&c.nodes.length>=3){toast('У схемі вже три дії. Натисни вибрану картку, щоб прибрати її.');return;}changed(i<0?'Додавання дії':'Вилучення дії',{slide:'scheme',action:node(id).text},()=>{if(i<0)c.nodes.push(id);else c.nodes.splice(i,1);selectedNode=i<0?id:'';},'scheme');}
function moveNode(id,to){const c=state.slides.scheme,i=c.nodes.indexOf(id);if(i<0||to<0||to>=c.nodes.length||to===i)return;changed('Переміщення кроку',{action:node(id).text,from:i+1,to:to+1},()=>{c.nodes.splice(i,1);c.nodes.splice(to,0,id);selectedNode=id;},'scheme');}
function openZoom(id){showModal(`<div class="between" style="margin-bottom:12px"><h2>${esc(META[id].name)}</h2>${btn('Закрити','close')}</div>${viewport(id,false)}`);fit();}
function applyManual(id,obj,patch,action){const before=objects(id).find(o=>o.id===obj);if(!before)return;changed(action,{slide:id,object:obj,from:before,to:patch},()=>{state.manual[id][obj]={...(state.manual[id][obj]||{}),...patch};},id);}
function activeId(){return state.stage===0?'cover':state.current;}

// unrecognized authored text is reserved for teacher review, not treated as correct.
function gradeNormalize(v){return String(v??'').normalize('NFC').toLocaleLowerCase('uk-UA').replace(/[’‘ʼ`]/g,"'").replace(/[^\p{L}\p{N}']+/gu,' ').trim().replace(/\s+/g,' ');}
function gradeWork(){
 const parts=[], extras=[];let current;
 const begin=(id,max)=>{current={id,name:META[id].name,max,points:0,pending:0,items:[]};parts.push(current);};
 const item=(label,max,ok,actual,expected,pending=false)=>{const points=ok?max:0;current.points+=points;if(pending)current.pending+=max;current.items.push({label,max,points,actual:String(actual??'—'),expected,status:ok?'зараховано':pending?'перевірити вручну':'не зараховано'});};
 const inSet=(v,list)=>list.some(x=>gradeNormalize(x)===gradeNormalize(v));
 const fixed=(label,max,value,accepted)=>item(label,max,inSet(value,accepted),value,accepted.join(' / '));
 const actual=(id,key)=>objects(id).find(o=>o.id===key)?.text||'';
 const field=(id,key,label,max,all,accepted,condition=true)=>{const value=actual(id,key),known=inSet(value,all),ok=condition&&inSet(value,accepted);const custom=!!gradeNormalize(value)&&!known;item(label,max,ok,value,accepted.join(' / '),custom&&condition);};
 const has=(id,kind)=>objects(id).some(o=>o.kind===kind);
 begin('cover',2);
 fixed('Аудиторія',.5,state.cover.audience,[AUDIENCES[0]]);
 fixed('Мета',.5,state.cover.goal,[GOALS[0]]);
 field('cover','title','Назва',.5,COVERTITLES,[COVERTITLES[0],COVERTITLES[2],COVERTITLES[4]]);
 field('cover','idea','Підзаголовок / основна думка',.5,COVERIDEAS,[COVERIDEAS[0],COVERIDEAS[3]]);
 begin('text',2);
 field('text','title','Заголовок',.5,TEXTTITLES,[TEXTTITLES[0],TEXTTITLES[3]]);
 field('text','body','Пояснення цифрового сліду',1,TEXTOPTIONS.map(x=>x.text),TEXTOPTIONS.slice(0,2).map(x=>x.text));
 field('text','examples','Приклади онлайн-дій та записів',.5,EXAMPLES,EXAMPLES.slice(0,2));
 begin('chart',3);
 field('chart','title','Заголовок',.5,CHARTTITLES,CHARTTITLES.slice(0,2));
 const vals=state.slides.chart.values, nums=vals.map(Number), chartPresent=has('chart','chart');
 CHARTROWS.forEach(([name,v],i)=>item(name,.5,chartPresent&&String(vals[i]).trim()!==''&&nums[i]===v,vals[i],String(v)));
 // A conclusion must match BOTH the source and the student's displayed data.
 const conclusion=actual('chart','conclusion'), ci=CONCLUSIONS.findIndex(x=>inSet(conclusion,[x]));
 const completeValues=vals.every(v=>String(v??'').trim()!==''&&Number.isInteger(Number(v))&&Number(v)>=0&&Number(v)<=24);
 const validConclusion=chartPresent&&completeValues&&(ci===0?nums[0]>nums[1]&&nums[0]>nums[2]:ci===1?nums[0]>0&&nums[0]*2===nums.reduce((a,b)=>a+b,0):false);
 item('Висновок за джерелом і даними слайда',1,validConclusion,conclusion,CONCLUSIONS.slice(0,2).join(' / ')+' (має підтверджуватися введеними даними)',chartPresent&&completeValues&&ci<0&&!!gradeNormalize(conclusion));
 begin('table',2);
 field('table','title','Заголовок',.25,TABLETITLES,TABLETITLES.slice(0,2));
 TABLEMODES.forEach((mode,i)=>item(mode,.5,has('table','table')&&inSet(state.slides.table.answers[i],[TABLEANS[i]]),state.slides.table.answers[i],TABLEANS[i]));
 field('table','note','Порада',.25,TABLENOTES,TABLENOTES.slice(0,2));
 begin('scheme',3);
 field('scheme','title','Заголовок',.5,SCHEMETITLES,SCHEMETITLES.slice(0,2));
 field('scheme','note','Вступ',.5,SCHEMENOTES,SCHEMENOTES.slice(0,2));
 const nodes=state.slides.scheme.nodes,required=['content','audience','decision'],schemePresent=has('scheme','scheme');
 required.forEach(id=>item('Дія: '+node(id).text,.5,schemePresent&&nodes.includes(id),nodes.includes(id)?'Є':'Немає',node(id).text));
 item('Послідовність дій',.5,schemePresent&&nodes.length===3&&required.every(x=>nodes.includes(x))&&nodes[2]==='decision',nodes.map(x=>node(x)?.text||x).join(' → '),'Перевірка змісту й даних та визначення аудиторії в будь-якому порядку; рішення про публікацію останнім');
 // Extra text may add information or contradict the core message. Do not silently grade it as valid.
 for(const id of IDS){const base=baseObjects(id);for(const o of objects(id).filter(x=>x.id.startsWith('extra-')&&['title','text'].includes(x.kind))){if(!base.some(b=>['title','text'].includes(b.kind)&&gradeNormalize(b.text)===gradeNormalize(o.text))&&!objects(id).some(b=>!b.id.startsWith('extra-')&&['title','text'].includes(b.kind)&&gradeNormalize(b.text)===gradeNormalize(o.text)))extras.push({slide:META[id].name,text:o.text});}}
 return {parts,points:parts.reduce((a,b)=>a+b.points,0),pending:parts.reduce((a,b)=>a+b.pending,0),extras,materialOK:!invalidPlan().length,orderOK:orderOK()};
}
function gradeSnapshot(id){const p=gradeWork().parts.find(x=>x.id===id);return {points:p.points,max:p.max,pending:p.pending,notCredited:p.items.filter(x=>x.status==='не зараховано').map(x=>x.label),review:p.items.filter(x=>x.status==='перевірити вручну').map(x=>x.label)};}

}

async function exportSlides(){if(exporting||submitting)return;const name=($('studentName')?.value||state.name).trim();if(name.split(/\s+/).filter(Boolean).length<2){pdfStatus('Введи ім’я та прізвище, щоб підписати PDF.',true);$('studentName')?.focus();return;}if(!pdfReady()){pdfStatus('Заверши та переглянь усі п’ять слайдів перед завантаженням.',true);return;}state.name=name;save();exporting=true;render();try{const filename=pdfFilename();const pdf=await makePresentationPDF((n,total)=>pdfStatus(`Створюємо PDF: слайд ${n} із ${total}…`));if(pdfDownloadURL)URL.revokeObjectURL(pdfDownloadURL);pdfDownloadURL=URL.createObjectURL(pdf);const a=document.createElement('a');a.href=pdfDownloadURL;a.download=filename;document.body.appendChild(a);a.click();a.remove();log('Експорт PDF',{filename,pages:IDS.length,bytes:pdf.size});save();exporting=false;render();const el=$('pdfStatus');if(el){el.textContent='PDF готовий. Якщо завантаження не почалося, ';const link=document.createElement('a');link.href=pdfDownloadURL;link.download=filename;link.textContent='натисни тут';el.append(link,document.createTextNode('.'));}}catch(err){console.error('PDF export',err);log('Помилка експорту PDF',{message:String(err)});save();exporting=false;render();pdfStatus('Не вдалося створити PDF. Спробуй ще раз або відкрий квест у Chrome. Роботу збережено.',true);}finally{exporting=false;}}

function action(a,b){if(exporting){toast('Дочекайся завершення створення PDF.');return;}if(submitting){toast('Дочекайся завершення надсилання.');return;}const d=b.dataset,id=d.id;switch(a){case 'start':go(0);state.tab='style';save();render();break;case 'home':go(-1);break;case 'go':reviewReturn=false;state.reviewEditing=false;go(+d.n);break;case 'reset':if(submitting){toast('Дочекайся завершення надсилання.');return;}showModal(`<div class="stack"><h2>Почати спочатку?</h2><p>Усі зміни й локальний прогрес цього квесту буде видалено. Уже надіслана робота залишиться у вчителя.</p><div class="row">${btn('Скасувати','close')}${btn('Так, почати спочатку','reset-confirm','','primary')}</div></div>`,true);break;case 'reset-confirm':try{localStorage.removeItem(STORAGE);}catch(e){}state=fresh();selected='';selectedNode='';reviewReturn=false;closeModal();save();render();window.scrollTo(0,0);break;case 'close':closeModal();break;case 'tab':state.tab=d.value;save();render();break;case 'layout':if(cfg(id).layout===d.value)break;changed('Зміна макета',{slide:id,from:cfg(id).layout,to:d.value},()=>{cfg(id).layout=d.value;resetGeometry(id);selected='';},id);break;case 'palette':showModal(`<div class="between"><h2>Оформлення презентації</h2>${btn('×','close','aria-label="Закрити"')}</div>${styles('cover')}`);break;case 'style':if(state.cover.style===d.value)break;changed('Зміна спільної палітри',{style:d.value},()=>{state.cover.style=d.value;for(const sid of IDS.slice(1))state.slides[sid].style='';state.done[3]=false;state.sent=null;},null);if(!$('modal').hidden)closeModal();break;case 'image':changed('Вибір ілюстрації',{slide:id,image:getImage(d.value)?.name},()=>{cfg(id).image=d.value;},id);break;case 'cover-next':{const p=slideProblem('cover');log('Спроба завершення обкладинки',{success:!p,reason:p,contentScore:gradeSnapshot('cover')});save();if(p){error(p);break;}if(reviewReturn&&state.done[2]){state.done[0]=true;returnToReview('cover');}else complete(0);break;}case 'back-cover':go(0);break;case 'plan-step':if(+d.step===0||!invalidPlan().length){state.planStep=+d.step;save();render();}break;case 'plan-back':state.planStep=0;save();render();break;case 'library':library(id);break;case 'assign':{if(Object.entries(state.assign).some(([sid,mid])=>sid!==id&&mid===d.material)){toast('Цей матеріал уже використано для іншого слайда.');break;}const prev=state.assign[id];changed('Відбір матеріалу',{slide:id,from:getMat(prev)?.title||'',to:getMat(d.material)?.title},()=>{state.assign[id]=d.material;state.done[1]=false;state.done[2]=false;state.done[3]=false;state.unlocked=Math.min(state.unlocked,1);state.viewed=[];state.sent=null;state.planStep=0;});closeModal();break;}case 'unassign':{const prev=state.assign[id];if(!prev)break;changed('Вилучення матеріалу',{slide:id,from:getMat(prev)?.title||''},()=>{state.assign[id]='';state.done[1]=false;state.done[2]=false;state.done[3]=false;state.unlocked=Math.min(state.unlocked,1);state.viewed=[];state.sent=null;state.planStep=0;});break;}case 'check-materials':verifyMaterials();break;case 'order':{const i=state.order.indexOf(id),j=i+(+d.d);if(j<1||j>4)break;changed('Зміна порядку слайдів',{slide:id,from:i+1,to:j+1},()=>{[state.order[i],state.order[j]]=[state.order[j],state.order[i]];state.done[1]=false;state.done[3]=false;state.unlocked=Math.min(state.unlocked,1);state.sent=null;state.viewed=[];});break;}case 'check-order':verifyOrder();break;case 'slide':state.current=id;state.tab=id==='chart'&&!state.slides.chart.layout?'layout':'content';selected='';selectedNode='';save();render();window.scrollTo({top:0,behavior:'instant'});break;case 'save-slide':saveSlide();break;case 'visual-back':{const i=IDS.indexOf(state.current);if(i>1){state.current=IDS[i-1];state.tab='content';selected='';save();render();window.scrollTo(0,0);}else go(1);break;}case 'note-pos':changed('Розміщення поради',{to:d.value},()=>{state.slides.table.notePos=d.value;resetGeometry('table');},'table');break;case 'scheme-toggle':toggleNode(id);break;case 'node-move':moveNode(id,state.slides.scheme.nodes.indexOf(id)+(+d.d));break;case 'manual-toggle':state.manualOn[id]=!state.manualOn[id];selected='';selectedNode='';log('Режим редагування',{slide:id,manual:state.manualOn[id]});save();render();break;case 'restore-layout':changed('Відновлення макета',{slide:id},()=>{resetGeometry(id);selected='';},id);toast('Розташування відновлено. Наповнення збережено.');break;case 'zoom':openZoom(id);break;case 'manual-edit':{const sid=activeId(),o=objects(sid).find(x=>x.id===d.obj);if(!o)break;showModal(`<div class="stack"><h2>Редагувати текст</h2><textarea id="manualText" rows="4" maxlength="500">${esc(o.text)}</textarea><div class="row">${btn('Скасувати','close')}${btn('Зберегти','manual-text-save',`data-id="${sid}" data-obj="${o.id}"`,'primary')}</div></div>`,true);break;}case 'manual-text-save':{const val=$('manualText').value.trim();if(!val){toast('Введи текст або скасуй зміну.');break;}applyManual(id,d.obj,{text:val},'Ручне редагування тексту');closeModal();break;}case 'duplicate':{const sid=activeId(),o=objects(sid).find(x=>x.id===d.obj);if(!o||objects(sid).length>=12)break;const newId='extra-'+uid();changed('Дублювання об’єкта',{slide:sid,object:o.id},()=>{state.manual[sid][newId]={...o,id:newId,x:clamp(o.x+20,0,960-o.w),y:clamp(o.y+20,0,540-o.h)};selected=newId;},sid);break;}case 'delete-obj':{const sid=activeId();applyManual(sid,d.obj,{hidden:true},'Видалення об’єкта');selected='';render();break;}case 'preview':case 'preview-index':state.preview=clamp(a==='preview'?state.preview+(+d.d):+d.index,0,4);if(!state.viewed.includes(IDS[state.preview]))state.viewed.push(IDS[state.preview]);save();render();break;case 'review-edit':reviewReturn=true;state.reviewEditing=true;if(id==='cover')go(0);else{state.current=id;go(2);}break;case 'export':exportSlides();break;}}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled){action(b.dataset.action,b);return;}const n=e.target.closest('[data-node]');if(n&&state.stage===2&&state.current==='scheme'&&!state.manualOn.scheme){selectedNode=n.dataset.node;render();return;}const o=e.target.closest('.slide-object.manual');if(o){if(selected!==o.dataset.object){selected=o.dataset.object;render();}return;}if(e.target===$('modal'))closeModal();});
document.addEventListener('change',e=>{if(e.target.matches('[data-field]'))updateField(e.target.dataset.field,e.target.value);else if(e.target.matches('[data-table-row]')){const i=+e.target.dataset.tableRow;changed('Заповнення таблиці',{row:TABLEMODES[i],from:state.slides.table.answers[i],to:e.target.value},()=>{state.slides.table.answers[i]=e.target.value;},'table');}});
document.addEventListener('input',e=>{if(e.target.id==='studentName'){state.name=e.target.value;save();if($('pdfFilename'))$('pdfFilename').textContent=pdfFilename();}else if(e.target.matches('[data-chart-row]')){const i=+e.target.dataset.chartRow,raw=e.target.value,clean=raw.replace(/[^0-9]/g,'').slice(0,2),val=clean===''?'':String(Math.min(24,Number(clean)));if(raw!==val)e.target.value=val;const c=state.slides.chart;if(c.values[i]!==val){changed('Заповнення діаграми',{row:CHARTROWS[i][0],from:c.values[i],to:val},()=>{c.values[i]=val;},'chart',false);const v=document.querySelector('.previewcard .viewport');if(v){v.innerHTML=slideHTML('chart',true);fit();}const hint=document.querySelector('.footin .hint');if(hint)hint.textContent=IDS.slice(1).filter(x=>state.slides[x].saved).length+' / 4 основні слайди збережено';const tab=document.querySelector('[data-action="slide"][data-id="chart"]');if(tab){tab.classList.remove('saved');tab.textContent='3. Діаграма';}}}});document.addEventListener('submit',e=>{if(e.target.id==='sendForm'){e.preventDefault();send();}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-node]')){e.preventDefault();selectedNode=e.target.dataset.node;render();}});
document.addEventListener('dragstart',e=>{const n=e.target.closest('[data-node]');if(n){dragNode=n.dataset.node;e.dataTransfer.setData('text/plain',dragNode);e.dataTransfer.effectAllowed='move';}});document.addEventListener('dragover',e=>{if(dragNode&&e.target.closest('[data-node]')){e.preventDefault();e.dataTransfer.dropEffect='move';}});document.addEventListener('drop',e=>{const n=e.target.closest('[data-node]');if(n&&dragNode){e.preventDefault();const from=dragNode;dragNode='';moveNode(from,state.slides.scheme.nodes.indexOf(n.dataset.node));}});document.addEventListener('dragend',()=>dragNode='');
document.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button'))return;const el=e.target.closest('.slide-object.manual');if(!el||state.stage!==0&&state.stage!==2)return;const id=activeId(),o=objects(id).find(x=>x.id===el.dataset.object);if(!o)return;const slide=el.closest('.slide'),rect=slide.getBoundingClientRect(),scale=rect.width/960,mode=e.target.dataset.handle||'move';e.preventDefault();pointer={pid:e.pointerId,id,obj:o.id,orig:clone(o),el,scale,mode,startX:e.clientX,startY:e.clientY,rect,changed:false};selected=o.id;el.setPointerCapture?.(e.pointerId);el.classList.add('sel');});
document.addEventListener('pointermove',e=>{const p=pointer;if(!p||e.pointerId!==p.pid)return;const o=p.orig,dx=(e.clientX-p.startX)/p.scale,dy=(e.clientY-p.startY)/p.scale;let x=o.x,y=o.y,w=o.w,h=o.h,size=o.size,rot=o.rot||0;if(Math.abs(dx)+Math.abs(dy)<3&&!p.changed)return;p.changed=true;if(p.mode==='move'){x=clamp(o.x+dx,0,960-o.w);y=clamp(o.y+dy,0,540-o.h);}else if(p.mode==='rot'){const cx=p.rect.left+(o.x+o.w/2)*p.scale,cy=p.rect.top+(o.y+o.h/2)*p.scale;rot=Math.round(Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI-90);}else if(p.mode==='w'||p.mode==='e'){if(p.mode==='w'){w=clamp(o.w-dx,80,o.x+o.w);x=o.x+o.w-w;}else w=clamp(o.w+dx,80,960-o.x);}else{const sign=p.mode.includes('w')?-1:1,signY=p.mode.includes('n')?-1:1;const f=clamp(1+(sign*dx/o.w+signY*dy/o.h)/2,.35,2.4);w=clamp(o.w*f,80,960);h=clamp(o.h*f,32,540);size=clamp(o.size*f,10,160);if(p.mode.includes('w'))x=o.x+o.w-w;if(p.mode.includes('n'))y=o.y+o.h-h;x=clamp(x,0,960-w);y=clamp(y,0,540-h);}p.patch={x,y,w,h,size,rot};Object.assign(p.el.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',fontSize:size+'px',transform:`rotate(${rot}deg)`});const inner=p.el.querySelector('.complex-inner');if(inner)inner.style.transform=`translate(-50%,-50%) scale(${Math.min(w/+inner.dataset.bw,h/+inner.dataset.bh)})`;if((p.mode==='w'||p.mode==='e')&&['text','title'].includes(o.kind)){const content=p.el.querySelector('.body');const needed=Math.min(540-y,content.scrollHeight);if(needed>h){p.patch.h=needed;p.el.style.height=needed+'px';}}});
function endPointer(e){const p=pointer;if(!p||e.pointerId!==p.pid)return;pointer=null;if(p.changed&&p.patch)applyManual(p.id,p.obj,p.patch,'Переміщення або зміна розміру');else render();}document.addEventListener('pointerup',endPointer);document.addEventListener('pointercancel',endPointer);document.addEventListener('dblclick',e=>{const el=e.target.closest('.slide-object.manual');if(el){const id=activeId(),o=objects(id).find(x=>x.id===el.dataset.object);if(o&&['title','text'].includes(o.kind))action('manual-edit',{dataset:{obj:o.id}});}});
render();
